# =============================================================
# Nginx configuration for node.simtrackr.b100x.in
# This MUST be applied on the server running nginx in front of
# the Express backend. Without this, nginx may strip CORS
# headers or fail to forward OPTIONS preflight requests.
# =============================================================

server {
    listen 443 ssl http2;
    server_name node.simtrackr.b100x.in;

    # SSL configuration (adjust paths for your server)
    # ssl_certificate     /etc/ssl/certs/node.simtrackr.b100x.in.crt;
    # ssl_certificate_key /etc/ssl/private/node.simtrackr.b100x.in.key;

    # Proxy all requests to the Express backend
    location / {
        proxy_pass http://127.0.0.1:5000;

        # --- Critical for CORS: forward ALL headers from Express ---
        # Do NOT add duplicate Access-Control-* headers here;
        # let Express handle CORS entirely. Only add headers
        # if Express does NOT set them (which it should now).

        # Pass the original Host header
        proxy_set_header Host $host;

        # Pass the real client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the Origin header — required for CORS
        proxy_set_header Origin $http_origin;

        # WebSocket support (for Socket.IO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # --- DO NOT add Access-Control-* headers here ---
        # The Express cors middleware handles CORS.
        # Adding them here would cause DUPLICATE headers which
        # browsers reject. If you must add them, remove the
        # cors middleware from Express and configure them here.
    }

    # Handle OPTIONS preflight requests explicitly
    # This is a safety net — Express should handle OPTIONS,
    # but some nginx configs block them before they reach Express
    location /api/ {
        if ($request_method = 'OPTIONS') {
            # Express handles CORS, so proxy OPTIONS to Express
            # rather than responding directly with nginx headers
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
        }

        # All other methods
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (increased for snapshot uploads)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Increase body size limit for file uploads
        client_max_body_size 20m;
    }
}

